<style>
/* ── 브랜드 컬러 ──
   주황 #FF6000 (포인트·버튼·리본) / 베이지 #F2EDE6 (배경) / 검정 #1C1C1C (글씨·선택 상태) / 노랑 #FFE066 (강조 하이라이트)
   ※ 주황은 작은 글씨에 쓰면 읽기 어려워(명도 대비 3:1) 글씨용으로는 진한 주황 #C24A00 사용 */
:root{
  --brand-orange:#FF6000; --brand-beige:#F2EDE6; --brand-black:#1C1C1C; --brand-yellow:#FFE066;
  --bg:#F2EDE6; --surface:#FFFFFF; --panel:#FBF8F4; --ink:#1C1C1C; --muted:#4A4743; --soft:#6E6A64;
  --line:#D9D1C5; --accent:#1C1C1C; --accent-ink:#FFFFFF; --warm:#C24A00; --note:#F7F1E8;
  --shelf:#FF6000; --shelf-shadow:#E2D9CC; --frame:#E8E0D5; --warn-bg:#FFF6D1; --warn-line:#F0D66A;
  --leave:#1C1C1C; --leave-bg:#FFFFFF; --scrim:#1C1C1Ccc; --pick:#FF6000;
  --cta:#FF6000; --cta-ink:#1C1C1C; --hl:#FFE066; --tab-line:#FF6000;
  --f-title:'SUITE Variable','SUITE','Pretendard Variable',Pretendard,sans-serif;
  --f-body:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-en:'Montserrat','Pretendard Variable',Pretendard,sans-serif;
  font-family:var(--f-body);
  color:var(--ink); background:var(--bg); color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C1C1C; --surface:#262626; --panel:#262626; --ink:#F2EDE6; --muted:#CFC8BE; --soft:#A39C92;
    --line:#3A3A3A; --accent:#F2EDE6; --accent-ink:#1C1C1C; --warm:#FF8A3D; --note:#2E2B26;
    --shelf:#FF6000; --shelf-shadow:#2A2A2A; --frame:#2A2A2A; --warn-bg:#2E2A1C; --warn-line:#6B5A1E;
    --leave:#F2EDE6; --leave-bg:#333333; --scrim:#000000cc; --pick:#FF6000; --hl:#8a6d00; --cover-ph:#333333; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1C1C; --surface:#262626; --panel:#262626; --ink:#F2EDE6; --muted:#CFC8BE; --soft:#A39C92;
  --line:#3A3A3A; --accent:#F2EDE6; --accent-ink:#1C1C1C; --warm:#FF8A3D; --note:#2E2B26;
  --shelf:#FF6000; --shelf-shadow:#2A2A2A; --frame:#2A2A2A; --warn-bg:#2E2A1C; --warn-line:#6B5A1E;
  --leave:#F2EDE6; --leave-bg:#333333; --scrim:#000000cc; --pick:#FF6000; --hl:#8a6d00; --cover-ph:#333333; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink)}
button,a,input{font:inherit;color:inherit}
button{cursor:pointer}
.shell{max-width:1180px;margin:auto;padding:26px 24px 80px}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* 책 카드 한줄평 미리보기: 2줄까지 */
.b-review{font-size:13px;line-height:1.5;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
input[type=search]::-webkit-search-cancel-button{display:none}

/* 상단 */
.mast{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}
.brand{font-size:24px;letter-spacing:-.055em;font-weight:800;color:inherit;text-decoration:none}
.mast-right{display:flex;align-items:center;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--soft)}
.theme-btn{border:1px solid var(--line);background:transparent;border-radius:30px;width:40px;height:40px;font-size:17px;display:grid;place-items:center}
.intro{display:flex;justify-content:space-between;gap:30px;align-items:end;padding:30px 0 20px}
.intro h1{font-weight:800;font-size:clamp(30px,4vw,46px);line-height:1.24;letter-spacing:-.07em;margin:0}
.intro p{font-size:16px;line-height:1.8;max-width:420px;color:var(--muted);margin:0;word-break:keep-all}

/* 검색 */
.search{position:relative;margin:0 0 18px}
.search input{width:100%;height:50px;border:1px solid var(--line);border-radius:30px;background:var(--surface);padding:0 48px 0 46px;font-size:16px;color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.search .ico{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.7;pointer-events:none}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:36px;height:36px;border-radius:50%;font-size:18px;color:var(--soft)}

/* 탭 */
.media-tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:0 0 22px;overflow-x:auto;scrollbar-width:none}
.media-tabs::-webkit-scrollbar{display:none}
.media-tabs button{border:0;background:transparent;border-bottom:3px solid transparent;padding:12px 2px;color:var(--soft);font-size:17px;font-weight:700;white-space:nowrap;min-height:48px}
.media-tabs button[aria-selected=true]{border-color:var(--accent);color:var(--accent)}
.media-tabs .n{font-size:12px;font-weight:600;opacity:.75;margin-left:3px}
/* 탭: 이모지 칸과 글자를 같은 높이(1em)의 상자로 만들고 세로 가운데로 맞춤 */
.media-tabs button{display:inline-flex;align-items:center;gap:5px}
.tab-ico{display:inline-flex;align-items:center;justify-content:center;width:1.2em;height:1em;line-height:1;flex:none}
.tab-txt{display:inline-block;line-height:1}
/* 그림 폭 보정: 📚🧸🎓는 17px, 🎬📝는 15px라서 🎬📝 칸만 양옆 1px씩 좁혀 눈에 보이는 간격을 맞춤.
   새 이모지를 쓰면 그림 폭에 맞춰 .tab-ico-키 에 칸 너비 보정을 추가 (디자인 가이드 ⑦) */
.tab-ico-movies,.tab-ico-tips,.tab-ico-study{width:calc(1.2em - 2px)}
/* 📱는 그림 폭 12px라 양옆 2.5px씩 좁힘 */
.tab-ico-apps{width:calc(1.2em - 5px)}

/* 필터 */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 26px}
.filters button{border:1px solid var(--line);border-radius:30px;padding:10px 17px;background:transparent;color:var(--ink);font-size:14px;min-height:44px}
.filters button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.count{font-size:13px;color:var(--soft);margin-bottom:16px}

/* 책장 */
.shelf{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px;border-bottom:13px solid var(--shelf);padding:12px 10px 20px;box-shadow:0 8px 0 var(--shelf-shadow);align-items:start}
.book{border:0;background:transparent;min-width:0;text-align:left;padding:0;display:flex;flex-direction:column;justify-content:flex-start;gap:8px}
.book .cover-frame{margin-bottom:4px}
/* ── 표지 가이드 ──
   틀(frame): 가로:세로 = 1:1.2, 표지는 틀 바닥에 붙여 가운데 정렬
   표지(cover): 틀 너비의 72%, 비율 1:1.45 고정 (국내 단행본 평균), 넘치는 부분은 가운데 기준으로 잘라 맞춤
   모서리: 책등 쪽(왼쪽) 2px, 바깥쪽 4px / 그림자: 오른쪽 아래 한 방향 */
:root{--cover-w:66%;--cover-ratio:1/1.45}
.cover-frame{aspect-ratio:1/1.25;flex:none;display:flex;align-items:center;justify-content:center;background:var(--frame);padding:0;border-radius:6px;position:relative;overflow:hidden}
/* 표지 상자(.cover): 크기·모서리·그림자 담당, 이미지는 안에서 꽉 채움 */
/* contain:size → 표지 상자 크기는 너비와 비율로만 정해짐 (iOS Safari가 원본 이미지 크기로 상자를 키우는 문제 방지) */
/* iOS Safari에서도 크기가 흔들리지 않도록 aspect-ratio 대신 padding 비율로 상자 높이를 고정 (1:1.45) */
.cover{display:block;position:relative;flex:none;width:var(--cover-w);height:0;padding-top:calc(var(--cover-w) * 1.45);min-height:0;border-radius:2px 4px 4px 2px;overflow:hidden;box-shadow:4px 4px 10px #0000002e;background:var(--cover-ph,#DDD4C8);transition:transform .2s,width .2s}
/* YES24 작은 이미지(L)는 가장자리에 1px 검은 테두리가 있어서, 사방 2px씩 키워 상자 밖으로 밀어내 숨김 */
/* 이미지는 상자를 꽉 채우고, 살짝 확대(3%)해서 YES24 작은 이미지의 1px 검은 테두리를 가림 */
.cover img{display:block;position:absolute;top:0;left:0;width:100%;height:100%;max-width:100%;object-fit:cover;object-position:center top;transform:scale(1.03);transform-origin:center center}
/* 흰 표지가 배경에 묻히지 않도록 아주 옅은 윤곽선 + 책등 쪽 음영 */
.cover::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px #0000001f,inset 3px 0 0 #00000010;pointer-events:none;z-index:1}
/* 넓적한 표지(1:1.3 미만): 양옆을 자르면 제목이 잘려서, 상자 크기는 다른 책과 같게 두고
   표지는 자르지 않고 가운데에 넣은 뒤 위아래 빈 곳을 같은 표지를 흐리게 깔아 채움 */
.cover.is-wide img{object-fit:contain;object-position:center center;transform:none;z-index:1}
.cover.is-wide img.blur-bg{object-fit:cover;filter:blur(10px) saturate(1.1);transform:scale(1.25);opacity:.85;z-index:0}
/* 아주 길쭉한 표지(1:1.62 초과)는 상자 크기는 그대로 두고 그 안에 자르지 않고 넣음 → JS fitCover에서 class만 붙임 */
.cover.is-fit{background:transparent;box-shadow:none;border-radius:0}
.cover.is-fit::after{display:none}
.cover.is-fit img{object-fit:contain;object-position:left bottom;transform:none;filter:drop-shadow(4px 4px 5px #0000002e)}
.book:hover .cover,.book:focus-visible .cover{transform:translateY(-5px)}
.cover-fallback{position:absolute;inset:0;background:#324f5d;color:#fff;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:14px;line-height:1.4;word-break:keep-all}
.cover-fallback .big{font-size:28px}
.meta{font-size:12px;color:var(--soft)}
.title{font-weight:700;line-height:1.5;font-size:16px;word-break:keep-all;overflow-wrap:anywhere}
.hint{font-size:13px;color:var(--warm);line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}

/* 영화·강의·유튜브 카드 */
.media-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.media-card{border:0;text-align:left;padding:0;background:var(--surface);min-width:0;box-shadow:0 3px 12px #17242a12;border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.media-art{height:270px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;position:relative;overflow:hidden}
.media-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* 포스터가 뜨면 위에 겹치는 글씨는 숨김 (포스터가 없을 때만 글씨 카드로 보여 줌) */
.media-art.has-poster>span{display:none}
.media-art .tag{position:relative;font-size:12px;letter-spacing:.1em}
.media-art .orig{position:relative;font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.25;opacity:.92}
.media-art .big-ico{position:relative;font-size:56px;opacity:.85}
.art-1{background:linear-gradient(145deg,#152f3d,#526b75)}
.art-2{background:linear-gradient(145deg,#5f4e48,#a07862)}
.art-3{background:linear-gradient(145deg,#2d4b55,#6c878d)}
.art-c1{background:#d6c4a6;color:#233640}
.art-c2{background:#a9bdba;color:#233640}
.media-copy{padding:16px 18px 20px;flex:1}
.media-copy b{display:block;font-size:17px;line-height:1.4;word-break:keep-all}
.media-copy small{display:block;margin-top:8px;color:var(--soft);font-size:13px;line-height:1.4}
.media-copy .hint{margin-top:8px}
.badge{display:inline-block;font-size:12px;font-weight:700;color:var(--leave);background:var(--leave-bg);padding:4px 9px;border-radius:20px;margin-bottom:8px}
.cover-frame .badge{position:absolute;left:8px;top:8px;margin:0}
/* 강력 추천: 표지 아래 라벨만 표시 (리본·테두리 없음) */
.pick-label{font-size:12px;font-weight:700;color:var(--pick);letter-spacing:.02em}
.pick-pill{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:var(--pick);padding:5px 11px;border-radius:20px;margin-bottom:8px}

/* 빈 결과 */
.empty{grid-column:1/-1;text-align:center;padding:44px 20px;color:var(--muted)}
.empty .big{font-size:40px;display:block;margin-bottom:10px}
.empty strong{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}
.empty p{margin:0 0 18px;line-height:1.6}
.suggest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.suggest button{border:1px solid var(--line);background:var(--surface);border-radius:30px;padding:9px 14px;font-size:14px;min-height:44px}

.source-line{color:var(--soft);font-size:12px;margin:20px 0;line-height:1.6}
.footer{border-top:1px solid var(--line);margin-top:66px;padding-top:16px;color:var(--soft);font-size:13px;line-height:1.7}

/* 상세: 데스크톱은 가운데, 모바일은 바텀시트 */
.dialog{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.dialog.open{display:flex}
.panel{background:var(--panel);width:min(640px,100%);max-height:90vh;overflow:auto;border-radius:14px;padding:24px;position:relative}
.grab{display:none}
.close{position:absolute;right:12px;top:10px;border:0;background:transparent;font-size:28px;width:44px;height:44px;border-radius:50%;color:var(--muted)}
.detail{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:start;padding-top:24px}
.detail img{width:100%;aspect-ratio:var(--cover-ratio);object-fit:cover;object-position:center top;border-radius:2px 4px 4px 2px;box-shadow:5px 8px 18px #0003,0 0 0 1px #0000001a;background:var(--cover-ph,#DDD4C8)}
/* 상세 창: 비율이 많이 다른 표지는 원래 비율 그대로 (흰 여백 없음) */
.detail img.fit{aspect-ratio:auto;height:auto;object-fit:fill}
.detail h2,.panel h2{font-size:24px;line-height:1.35;letter-spacing:-.04em;margin:8px 0}
.panel p{line-height:1.65;color:var(--muted);margin:6px 0}
.pill{font-size:13px;color:var(--warm);font-weight:700}
.when{display:inline-block;margin-top:6px;background:var(--note);border-radius:20px;padding:6px 12px;font-size:14px;color:var(--ink)}
.review{margin:20px 0 0;padding:18px;background:var(--note);border-radius:10px}
.review h3{margin:0 0 8px;font-size:13px;letter-spacing:.04em;color:var(--warm)}
.review blockquote{margin:0;font-size:17px;line-height:1.65}
.review.todo{background:transparent;border:2px dashed var(--line)}
.review.todo blockquote{color:var(--soft);font-size:15px}
.disclaimer{display:flex;gap:10px;margin:14px 0 0;padding:12px 14px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;font-size:13px;line-height:1.55;color:var(--ink)}
.info{margin:14px 0 0;font-size:14px;line-height:1.6;color:var(--muted)}
.out{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:22px;background:var(--accent);color:var(--accent-ink);text-decoration:none;padding:14px 18px;border-radius:8px;font-size:15px;font-weight:700;min-height:50px}
.out-note{font-size:12px;color:var(--soft);text-align:center;margin-top:8px}
/* YES24 애드온(제휴) 링크 수수료 안내: 버튼 바로 아래 */
.ad-note{display:flex;gap:6px;align-items:flex-start;margin:10px 2px 0;font-size:12px;line-height:1.55;color:var(--soft);word-break:keep-all}
.ad-note i{flex:none;font-style:normal;font-family:var(--f-en);font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--warm);background:#FFF1E8;border-radius:4px;padding:1px 6px;margin-top:1px}

@media(max-width:1100px){
  .shelf{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(max-width:940px){
  .shelf{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:780px){
  .shell{padding:20px 18px 60px}
  .intro{display:block;padding:22px 0 16px}
  .intro p{margin-top:14px}
  .shelf{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
  .title{font-size:15px}
  .media-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .media-art{height:220px}
}
@media(max-width:560px){
  .shell{padding:16px 16px 60px}
  .mast .eyebrow{display:none}
  .brand{font-size:21px}
  .intro h1{font-size:clamp(25px,7.2vw,30px);line-height:1.35}
  .intro p{font-size:15px}
  .media-tabs{gap:18px}
  .media-tabs button{font-size:16px}
  .filters{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 22px;padding:0 16px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters button{padding:9px 14px;white-space:nowrap;flex:none}
  .media-list{grid-template-columns:1fr}
  .media-card{flex-direction:row}
  .media-art{width:42%;height:auto;min-height:190px;padding:16px;flex:none}
  .media-art .orig{font-size:17px}
  .media-art .big-ico{font-size:40px}
  .media-copy{padding:16px}
  /* 바텀시트 */
  .dialog{align-items:flex-end;padding:0}
  .panel{width:100%;max-height:88vh;border-radius:18px 18px 0 0;padding:14px 20px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
  .grab{display:block;width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 6px}
  .detail{grid-template-columns:96px 1fr;gap:16px;padding-top:18px}
  .detail h2,.panel h2{font-size:20px}
}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── 브랜드 적용 ── */
/* 폰트 역할 */
.brand,.intro h1,.panel h2,.title,.media-copy b,.media-tabs button,.empty strong,.review h3{font-family:var(--f-title)}
.en,.eyebrow,.media-art .tag,.media-art .orig{font-family:var(--f-en)}
.brand{font-weight:800;letter-spacing:-.04em}
.brand .zip{font-family:var(--f-en);font-weight:800;color:var(--brand-orange);letter-spacing:0;margin-left:1px}
.eyebrow{font-weight:600;letter-spacing:.2em;color:var(--ink)}
.intro h1{font-weight:800;letter-spacing:-.05em}
.intro h1 mark{background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);color:inherit;padding:0 .04em}
.intro h1 .dot{color:var(--brand-orange)}
.title{font-weight:700;letter-spacing:-.02em}

/* 탭: 선택 밑줄 주황 */
.media-tabs button{font-weight:700}
.media-tabs button[aria-selected=true]{border-color:var(--tab-line);color:var(--ink)}

/* 필터: 선택 검정, 마우스 올리면 주황 테두리 */
.filters button{background:var(--surface);border-color:var(--line);font-weight:500}
.filters button:hover{border-color:var(--brand-orange)}
.filters button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* 검색 */
.search input{border-color:var(--line)}
.search input:focus{outline:2px solid var(--brand-orange);outline-offset:1px}

/* 책장 */
.shelf{border-bottom-width:8px;box-shadow:0 6px 0 var(--shelf-shadow)}
.cover-fallback{background:var(--brand-black)}
.pick-label{align-self:flex-start;background:var(--brand-yellow);color:#1C1C1C;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700}
.pick-pill{background:var(--brand-yellow);color:#1C1C1C}
.badge{border:1px solid var(--line)}

/* 영화·강의·유튜브 카드 */
.art-1{background:#1C1C1C}
.art-2{background:#FF6000;color:#1C1C1C}
.art-3{background:#3A3530}
.art-c1{background:#FFE066;color:#1C1C1C}
.art-c2{background:#1C1C1C;color:#F2EDE6}
.media-art .tag{font-weight:600;letter-spacing:.14em}
.media-art .orig{font-weight:700;letter-spacing:-.01em}
.media-card{box-shadow:none;border:1px solid var(--line)}

/* 유튜브 채널 카드: 채널 프로필을 원형으로 크게, 핸들은 영문 폰트 */
.yt-art{align-items:flex-start}
.yt-1{background:#1C1C1C;color:#F2EDE6}
.yt-2{background:#FF6000;color:#1C1C1C}
.yt-avatar{position:relative;align-self:center;width:112px;height:112px;border-radius:50%;overflow:hidden;background:#3A3A3A;box-shadow:0 0 0 4px #F2EDE6,0 6px 16px #00000040;display:grid;place-items:center;flex:none}
.yt-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.yt-ph{font-size:34px;color:#FF6000}
.yt-handle{position:relative;align-self:center;font-family:var(--f-en);font-size:12px;font-weight:600;letter-spacing:.02em;opacity:.9;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.yt-head{display:flex;gap:16px;align-items:center;padding-top:22px}
.yt-avatar.sm{width:72px;height:72px;box-shadow:0 0 0 3px var(--panel),0 4px 10px #00000030}
.yt-head h2{margin:4px 0 2px}
.en-handle{font-family:var(--f-en);font-size:13px}
.yt-about{margin:14px 0 0!important;font-size:15px;color:var(--ink)!important;line-height:1.65}
@media(max-width:560px){
  .yt-avatar{width:84px;height:84px}
  .yt-ph{font-size:26px}
  .yt-handle{font-size:10.5px}
}

/* 만든 사람: 상단 프로필 버튼 → 소개 창(상세 창과 같은 바텀시트), 한줄평에는 서명 */
.profile-btn{width:44px;height:44px;border-radius:50%;border:0;padding:0;background:var(--brand-yellow);color:#1C1C1C;display:grid;place-items:center;font-family:var(--f-title);font-weight:800;font-size:17px;box-shadow:0 0 0 2px var(--brand-orange);overflow:hidden}
.profile-btn img{width:100%;height:100%;object-fit:cover}
.profile-btn:hover{box-shadow:0 0 0 3px var(--brand-orange)}
.mast-right{gap:10px}
.about-sheet{padding-top:20px}
.about-sheet .eyebrow{font-family:var(--f-en);font-weight:700;font-size:11px;letter-spacing:.2em;color:var(--warm);display:block}
.about-sheet .who{display:flex;gap:14px;align-items:center;margin:10px 0 14px}
.about-sheet .avatar{flex:none;width:68px;height:68px;border-radius:50%;background:var(--brand-yellow);color:#1C1C1C;display:grid;place-items:center;font-family:var(--f-title);font-weight:800;font-size:26px;box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--brand-orange);overflow:hidden}
.about-sheet .avatar img{width:100%;height:100%;object-fit:cover}
.about-sheet h2{margin:0 0 2px}
.about-sheet small{font-size:13.5px;color:var(--soft)}
.about-sheet .story{font-size:15px;line-height:1.75;color:var(--ink)!important;margin:0 0 14px!important}
.about-sheet .counts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.about-sheet .counts span{font-size:12.5px;font-weight:700;background:var(--brand-yellow);color:#1C1C1C;border-radius:20px;padding:5px 11px}
.about-sheet h3{font-family:var(--f-title);font-weight:800;font-size:14px;margin:0 0 8px}
.about-sheet ul{margin:0 0 20px;padding:14px 16px;list-style:none;display:grid;gap:8px;font-size:14px;line-height:1.55;background:var(--note);border-radius:10px}
.about-sheet li{display:flex;gap:9px}
.about-sheet li::before{content:"✓";color:var(--brand-orange);font-weight:800}
.about-sheet .sns{display:flex;gap:8px;flex-wrap:wrap}
.about-sheet .sns a,.about-sheet .sns span{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:30px;font-size:14px;font-weight:700;text-decoration:none;border:1px solid var(--line);color:var(--ink)}
.about-sheet .sns a.primary{background:var(--brand-orange);border-color:var(--brand-orange);color:#1C1C1C}
.about-sheet .sns span{border-style:dashed;color:var(--soft);font-weight:500}
.sig{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;font-weight:700;color:var(--ink)}
.sig-av{width:26px;height:26px;border-radius:50%;background:var(--brand-yellow);color:#1C1C1C;display:grid;place-items:center;font-family:var(--f-title);font-weight:800;font-size:12px;overflow:hidden;flex:none}
.sig-av img{width:100%;height:100%;object-fit:cover}
@media(max-width:560px){.mast-right{gap:8px}}

/* 탭이 화면보다 길 때: 오른쪽 끝 흐림으로 '더 있음'을 알려 줌 */
.media-tabs.more{-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent)}
.media-tabs.more.end{-webkit-mask-image:none;mask-image:none}
@media(max-width:560px){.media-tabs{gap:14px}.media-tabs button{font-size:15px}}

/* 꿀팁 카드: 이미지 없는 글 카드. 체크리스트가 핵심 */
.tip-card{flex-direction:column!important;padding:20px;gap:12px;border-top:4px solid var(--brand-orange)}
.tip-top{display:flex;align-items:center;gap:8px}
.tip-icon{width:36px;height:36px;border-radius:50%;background:var(--brand-yellow);display:grid;place-items:center;font-size:18px;flex:none}
.tip-topic{font-size:13px;font-weight:700;color:var(--warm)}
.tip-card>b{font-family:var(--f-title);font-weight:800;font-size:18px;line-height:1.45;letter-spacing:-.02em;word-break:keep-all}
.tip-points{margin:0;padding:0;list-style:none;display:grid;gap:7px;font-size:14px;line-height:1.55;color:var(--ink)}
.tip-points li{display:flex;gap:8px}
.tip-points li::before{content:"✓";color:var(--brand-orange);font-weight:800;flex:none}
.tip-foot{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--soft)}
.panel .tip-points{margin-top:14px;font-size:15px;background:var(--note);border-radius:10px;padding:14px 16px}
.tip-date{font-size:13px!important;color:var(--soft)!important}
.tip-fact{margin:14px 0 0;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tip-fact h3,.tip-related h3{margin:0 0 8px;font-family:var(--f-title);font-size:14px;color:var(--ink)}
.tip-fact p{margin:0 0 10px!important;font-size:14px;color:var(--ink)!important}
.tip-fact a{display:inline-flex;min-height:44px;align-items:center;font-size:13.5px;font-weight:700;color:var(--warm);text-decoration:underline;text-underline-offset:3px}
.tip-related{margin-top:18px}
.tip-related div{display:flex;flex-wrap:wrap;gap:8px}
.tip-related button{border:1px solid var(--line);background:var(--surface);border-radius:30px;padding:0 14px;min-height:44px;font-size:14px;font-weight:600;text-align:left}
.tip-related button:hover{border-color:var(--brand-orange)}

/* 공부 탭: 유튜브·강의 통일 카드 + 위쪽 선택 버튼(세그먼트) */
.filters.seg{display:flex;flex-wrap:nowrap;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:3px;max-width:420px}
.filters.seg button{flex:1;border:0;border-radius:30px;background:transparent;min-height:44px;font-weight:700;font-size:14px;color:var(--soft);padding:0 10px}
.filters.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.seg-n{font-family:var(--f-en);font-size:12px;opacity:.8}
.study-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.study-card{position:relative;display:flex;flex-direction:row;align-items:center;gap:16px;padding:16px 40px 16px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none;min-width:0}
a.study-card:hover{border-color:var(--brand-orange)}
a.study-card:focus-visible{outline:2px solid var(--brand-orange);outline-offset:2px}
.s-go{position:absolute;right:14px;top:14px;font-size:16px;font-weight:800;color:var(--soft)}
.s-circle{position:relative;flex:none;width:68px;height:68px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:30px}
.s-circle.yt{background:#3A3A3A;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--brand-orange)}
.s-circle.yt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.s-circle .s-ph{font-size:22px;color:var(--brand-orange)}
.s-circle.course{background:var(--brand-yellow);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--brand-black)}
.s-body{min-width:0;display:flex;flex-direction:column;gap:3px}
.s-kind{font-family:var(--f-en);font-weight:700;font-size:10.5px;letter-spacing:.14em;color:var(--soft)}
.s-kind.yt{color:#C4302B}
.s-body b{font-family:var(--f-title);font-weight:800;font-size:16px;line-height:1.35;word-break:keep-all}
.s-body small{font-size:12.5px;color:var(--soft);line-height:1.4;overflow-wrap:anywhere}
.s-body .hint{margin-top:2px}
@media(max-width:780px){.study-list{grid-template-columns:1fr}.s-circle{width:56px;height:56px;font-size:25px}.study-card{padding:14px 36px 14px 14px;gap:13px}.filters.seg{margin:0 0 18px;padding:3px;overflow:visible}}

/* 영화·드라마: 포스터 그리드 (원래 비율 그대로, 상세 창 없음) */
.movie-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:26px 18px;align-items:start}
.m-card{min-width:0;display:flex;flex-direction:column;gap:6px}
.m-poster{display:block;width:100%;height:auto;aspect-ratio:2/3;object-fit:cover;object-position:center top;border-radius:6px;box-shadow:4px 5px 12px #0000002e;background:var(--frame);margin-bottom:16px}
.m-fallback{aspect-ratio:2/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;text-align:center;font-size:30px;background:var(--brand-black);color:var(--brand-beige)}
.m-fallback span{font-family:var(--f-title);font-size:14px;font-weight:700;line-height:1.4;word-break:keep-all}
.m-kind{font-family:var(--f-en);font-weight:700;font-size:11px;letter-spacing:.12em;color:var(--soft)}
.m-title{font-family:var(--f-title);font-weight:800;font-size:16px;line-height:1.4;word-break:keep-all}
.m-review{margin:2px 0 0;font-size:13.5px;line-height:1.55;color:var(--ink);background:var(--note);border-left:3px solid var(--brand-orange);border-radius:4px;padding:8px 10px;word-break:keep-all}
.m-hint{margin:0;font-size:13px;line-height:1.45;color:var(--warm);word-break:keep-all}
@media(max-width:1100px){.movie-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:940px){.movie-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:780px){.movie-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}.m-title{font-size:15px}.m-review{font-size:13px}}

/* 콘텐츠 › 웹툰: 가로 카드에서는 세로 표지(1:1.3), 웹툰만 볼 때는 2열 표지 그리드 */
.s-webtoon{flex:none;width:56px;height:73px;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px #0000001a,2px 3px 8px #0000002a;background:var(--frame)}
.s-webtoon img{display:block;width:100%;height:100%;object-fit:cover}
.s-kind.webtoon{color:#00A94F}
/* 유튜브 개별 영상: 16:9 썸네일 + 빨간 재생 버튼, 제목은 2줄까지 */
.study-card.is-video{align-items:flex-start}
.s-video{flex:none;position:relative;width:112px;height:63px;border-radius:8px;overflow:hidden;background:#000;margin-top:2px}
.s-video img{display:block;width:100%;height:100%;object-fit:cover}
.s-play{position:absolute;left:50%;top:50%;width:34px;height:24px;margin:-12px 0 0 -17px;border-radius:7px;background:#FF0000E6}
.s-play::after{content:"";position:absolute;left:13px;top:6px;border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
.s-clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.webtoon-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:26px 18px;align-items:start}
.w-card{display:flex;flex-direction:column;gap:4px;min-width:0;color:inherit;text-decoration:none}
.w-cover{display:block;width:100%;height:0;padding-top:129.8%;position:relative;border-radius:8px;overflow:hidden;box-shadow:4px 5px 12px #0000002e;background:var(--frame);margin-bottom:12px}
.w-cover img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.w-card:hover .w-cover{box-shadow:0 0 0 2px var(--brand-orange),4px 5px 12px #0000002e}
.w-kind{font-family:var(--f-en);font-weight:700;font-size:11px;letter-spacing:.12em;color:#00A94F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-title{font-family:var(--f-title);font-weight:800;font-size:16px;line-height:1.4;word-break:keep-all}
.w-author{font-size:12.5px;color:var(--soft)}
@media(max-width:1100px){.webtoon-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:940px){.webtoon-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:780px){.webtoon-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}.w-title{font-size:15px}}

/* 앱: 둥근 사각형 아이콘 + 글 + 기기에 맞는 스토어 버튼 */
.app-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.app-card{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.app-icon{width:64px;height:64px;border-radius:15px;box-shadow:0 0 0 1px #0000001a;object-fit:cover;background:var(--frame)}
.app-ph{display:grid;place-items:center;font-size:28px}
.app-body{min-width:0;display:flex;flex-direction:column;gap:2px}
.app-kind{font-family:var(--f-en);font-weight:700;font-size:10.5px;letter-spacing:.14em;color:var(--soft)}
.app-body b{font-family:var(--f-title);font-weight:800;font-size:17px;line-height:1.35;word-break:keep-all}
.app-body small{font-size:12.5px;color:var(--soft)}
.app-body .hint{margin-top:4px}
.app-about{margin:4px 0 0;font-size:13px;line-height:1.55;color:var(--ink);word-break:keep-all}
.stores{grid-column:1/-1;display:flex;gap:8px}
.store{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;border-radius:10px;font-size:13.5px;font-weight:700;background:var(--brand-black);color:#fff;text-decoration:none;border:1.5px solid var(--brand-black)}
.store.light{background:transparent;color:var(--ink)}
.store:hover{border-color:var(--brand-orange)}
.store svg{width:17px;height:17px;fill:currentColor;flex:none}
@media(max-width:780px){.app-list{grid-template-columns:1fr}}

/* 꿀팁: 블로그 글을 큰 썸네일 카드로. 누르면 상세 창 없이 블로그 글로 바로 이동 (새 창) */
.blog-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}
.blog-card{display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none}
a.blog-card:hover{border-color:var(--brand-orange)}
a.blog-card:focus-visible{outline:2px solid var(--brand-orange);outline-offset:2px}
.blog-thumb{position:relative;display:block;width:100%;height:0;padding-top:62.5%;background:var(--frame);overflow:hidden}
.blog-thumb img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
/* 썸네일이 안 뜨면 브랜드 색 배경 + 제목 */
.blog-ph{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:18px;text-align:center;background:var(--brand-black);color:var(--brand-beige);font-family:var(--f-title);font-weight:800;font-size:17px;line-height:1.4;word-break:keep-all}
.blog-body{display:flex;flex-direction:column;gap:4px;padding:13px 15px 15px}
.blog-kind{font-family:var(--f-en);font-weight:700;font-size:10.5px;letter-spacing:.14em;color:#03A94D}
.blog-body b{font-family:var(--f-title);font-weight:800;font-size:17px;line-height:1.4;word-break:keep-all}
.blog-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--soft)}
.blog-foot .date{font-family:var(--f-en);font-weight:600}
.blog-foot .go{font-weight:700}
@media(max-width:940px){.blog-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.blog-list{grid-template-columns:1fr;gap:16px}}

/* 상세 */
.pill{color:var(--warm)}
.review{background:var(--note);border-left:4px solid var(--brand-orange)}
.review.todo{border:2px dashed var(--line)}
.out{background:var(--cta);color:var(--cta-ink);font-family:var(--f-title);font-weight:800;border-radius:30px}
.out:hover{filter:brightness(1.05)}
/* QA: 터치 영역 44px 이상 */
.theme-btn{width:44px;height:44px}
.search .clear{width:44px;height:44px;right:3px}
.empty .reset{margin-top:4px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:30px;padding:11px 18px;font-weight:700;min-height:44px}
.suggest button:hover{border-color:var(--brand-orange)}

/* ── 카드 글 줄 맞춤 기준 ──
   같은 줄에 놓인 카드끼리 표지 / 강력 추천 / 주제·저자 / 제목 / 한줄평 / 이럴 때 보세요 칸의 시작 높이를 맞춤.
   각 칸의 높이는 그 줄에서 가장 긴 카드에 맞춰지고, 빈 칸은 높이 0 (subgrid 지원 브라우저, 미지원이면 기존 배치) */
.pick-label:empty{padding:0;background:none}
.meta:empty,.b-review:empty,.hint:empty,.m-hint:empty{margin:0}
@supports (grid-template-rows: subgrid){
  .shelf{row-gap:0}
  .book{display:grid;grid-row:span 6;grid-template-rows:subgrid;row-gap:0;align-content:start;margin-bottom:28px}
  .book>*{margin-bottom:8px;min-width:0;min-height:0}
  .book>*:empty{margin-bottom:0}
  .book>.cover-frame{margin-bottom:12px}
  .book>.pick-label{justify-self:start}
  .movie-grid{row-gap:0}
  .m-card{display:grid;grid-row:span 4;grid-template-rows:subgrid;row-gap:0;margin-bottom:26px}
  .m-card>*{margin-bottom:6px}
  .m-card>*:empty{margin-bottom:0}
  /* 포스터 그림자 때문에 글이 붙어 보여서 포스터 아래만 넓게 (디자인 가이드 ⑨) */
  .m-card>.m-poster{margin-bottom:16px}
}

/* ── 카드 왼쪽 선 맞춤 ──
   표지·강력 추천·주제·제목·한줄평·이럴 때 보세요가 모두 같은 왼쪽 선에서 시작.
   표지는 카드 너비를 꽉 채우고(틀 배경 없음), 줄 안의 표지들은 아래 선을 맞춤.
   카드 글 앞의 이모지와 따옴표는 빼서 첫 글자 위치를 통일 */
:root{--cover-w:100%}
.book .cover-frame{aspect-ratio:auto;background:transparent;border-radius:0;overflow:visible;display:flex;align-items:flex-end;justify-content:flex-start}
@supports (grid-template-rows: subgrid){.book>.cover-frame{align-self:end}}
.book .cover{border-radius:3px 6px 6px 3px}
.b-review{color:var(--muted)}
.book .hint,.m-hint,.study-card .hint{display:block;color:var(--warm);font-weight:600}

/* 맨 위로 버튼 */
.to-top{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:20px;font-weight:800;box-shadow:0 4px 12px #00000033;z-index:4;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}
.to-top.show{opacity:1;transform:none;pointer-events:auto}
.to-top:focus-visible{outline:2px solid var(--brand-orange);outline-offset:2px}
</style>
</head>
<body>
<main class="shell">
  <header class="mast">
    <a class="brand" id="homeLink" href="./" aria-label="마음은 언제나 미니멀 육아 홈으로">마음은 언제나 <span class="zip">미니멀 육아</span></a>
    <div class="mast-right">
      <span class="eyebrow">READ · WATCH · LEARN</span>
      <button class="profile-btn" id="profileBtn" type="button" aria-label="만든 사람 소개"></button>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="화면 밝기 전환">🌙</button>
    </div>
  </header>

  <section class="intro">
    <h1>육아하면서 <mark>좋았던 것들</mark><br>함께 나눠요<span class="dot">!</span></h1>
    <p>당신의 육아가 보다 행복하길 바라며<br>직접 써보고 좋았던 것들을 정리했습니다</p>
  </section>

  <div class="search" role="search">
    <span class="ico" aria-hidden="true">🔍</span>
    <input id="q" type="search" placeholder="제목·저자·고민으로 검색" aria-label="추천 검색" autocomplete="off">
    <button class="clear hidden" id="clearQ" type="button" aria-label="검색어 지우기">✕</button>
  </div>

  <nav class="media-tabs" role="tablist" id="tabs"></nav>
  <div class="filters" id="filters"></div>
  <div class="count" id="count"></div>
  <h2 class="sr-only" id="list-title">책 목록</h2>
  <section id="list" role="tabpanel" aria-live="polite" aria-labelledby="list-title"></section>
  <p class="source-line" id="source"></p>

  <button class="to-top" id="toTop" type="button" aria-label="맨 위로 이동">↑</button>
  <footer class="footer">
    모든 추천은 직접 보고 경험한 개인적인 기록입니다. 건강·의료 관련 결정은 꼭 전문가와 상담하세요.
  </footer>
</main>

<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="detail-title">
  <div class="panel">
    <div class="grab" aria-hidden="true"></div>
    <button class="close" id="close" type="button" aria-label="닫기">×</button>
    <div id="detail"></div>
  </div>
</div>

  nickname:'미도리',
  avatar:PROFILE_IMG, avatarText:'미',
  role:'24년생 아기를 키우는 워킹맘',

/* 프로필 버튼 + 소개 창 + 한줄평 서명 */
// 프로필 이미지를 못 불러오면 글자(예: '미')로 대신 표시
function avatarHTML(){return PROFILE.avatar?`<img src="${esc(PROFILE.avatar)}" alt="" onerror="this.replaceWith(document.createTextNode('${esc(PROFILE.avatarText).replace(/'/g,'')}'))">`:esc(PROFILE.avatarText);}
function renderProfileBtn(){
  const b=$('profileBtn'); b.innerHTML=avatarHTML();
  b.setAttribute('aria-label',`만든 사람 소개: ${PROFILE.nickname}`);
  b.onclick=openAbout;
}
// 상세 창 한줄평·꿀팁 이야기 아래에 붙는 서명
function signature(word){return `<div class="sig"><span class="sig-av" aria-hidden="true">${avatarHTML()}</span><span>${esc(PROFILE.nickname)}의 ${word}</span></div>`;}
function openAbout(){
  const p=PROFILE;
  const links=p.links.filter(l=>l.url).map((l,i)=>l.url
    ?`<a class="${i===0?'primary':''}" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label)} ↗</a>`
    :`<span title="데이터의 links에 주소를 넣으면 버튼이 활성화돼요">${esc(l.label)} · 주소 입력 필요</span>`).join('');
  // 콘텐츠 수는 데이터에서 자동으로 셈
  const counts=[['📚','권의 책',books],['🎬','편의 영화',movies],['🎓','개의 강의',courses],['🎧','편의 웹툰',webtoons],['▶️','개의 채널',youtube],['🧸','개의 용품',goods],['📱','개의 앱',apps],['📝','개의 후기',SHOW_TIPS?blogs:[]]]
    .filter(c=>c[2].length).map(c=>`<span>${c[0]} ${c[2].length}${c[1]}</span>`).join('');
  lastFocus=document.activeElement;
  $('detail').innerHTML=`<div class="about-sheet">
      <span class="eyebrow">CURATED BY</span>
      <div class="who"><span class="avatar">${avatarHTML()}</span><div><h2 id="detail-title">${esc(p.nickname)}</h2><small>${esc(p.role)}</small></div></div>
      <p class="story">${esc(p.story)}</p>
      <div class="counts">${counts}</div>
      <h3>이런 기준으로 골라요</h3>
      <ul>${p.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
      ${links?`<div class="sns">${links}</div>`:''}
    </div>`;
  showDialog(false);
}

const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,'');
const catName=c=>c.replace(/^\S+\s/,'');

function matches(it){
  if(!q) return true;
  // 검색 대상: 제목·저자·주제·이럴 때 보세요·한줄평(추천 이유)·소개 글 등 화면에 보이는 글 전체
  const hay=norm([it.title,it.author,it.original,it.provider,it.handle,it.channel,it.dev,it.about,it.topic,(it.points||[]).join(' '),it.fact,it.body,it.category,it.theme,it.hint,it.review,it.days,it.kind].join(' '));
  return hay.includes(norm(q));
}
// 접속(새로고침)할 때마다 새로 뽑는 숫자와 콘텐츠를 섞어 만든 값 → 들어올 때마다 순서가 바뀜
// (한 번 접속한 동안에는 탭·필터를 바꿔도 순서가 유지됨)
const VISIT=Math.random().toString(36).slice(2);
function dailyKey(it){
  const s=VISIT+'|'+(it.id||it.tmdb||it.url||it.title||'');
  let h=2166136261;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return h>>>0;
}
function current(){
  const t=TABS.find(x=>x.key===tab);
  // 도서·영화·용품·후기: 접속할 때마다 랜덤, 강력 추천은 항상 맨 앞(강력 추천끼리도 섞음)
  // 학습 탭은 시트의 순서 그대로
  let items=t.items.filter(matches);
  if(tab==='books'||tab==='movies'||tab==='goods'||tab==='tips'||tab==='apps'){
    items=items.slice().sort((a,b)=>((b.pick?1:0)-(a.pick?1:0))||(dailyKey(a)-dailyKey(b)));
  }
  if(tab==='books' && cat!=='전체'){
    items=items.filter(b=>b.category===catName(cat));
  }
  if(tab==='study' && studyKind!=='all'){
    items=items.filter(it=>it._kind===studyKind);
  }
  if(tab==='movies' && movieKind!=='전체'){
    items=items.filter(it=>mKind(it)===movieKind);
  }
  return {t,items};
}

function renderTabs(){

    const [ico,...rest]=t.label.split(' ');
    return `<button role="tab" type="button" data-k="${t.key}" aria-selected="${t.key===tab}" aria-controls="list" tabindex="${t.key===tab?0:-1}"><span class="tab-ico tab-ico-${t.key}" aria-hidden="true">${ico}</span><span class="tab-txt">${rest.join(' ')}</span>${q?`<span class="n">${n}</span>`:''}</button>`;
  }).join('');
  // QA: 다시 그린 뒤에도 키보드 포커스가 사라지지 않도록 같은 버튼에 포커스를 되돌림
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;cat='전체';studyKind='all';movieKind='전체';render();$('tabs').querySelector(`[data-k="${tab}"]`).focus();});
  // 선택된 탭이 화면 밖이면 보이도록 이동 + 넘침 여부에 따라 흐림 효과
  const nav=$('tabs'), cur=nav.querySelector('[aria-selected="true"]');
  const syncMore=()=>{const over=nav.scrollWidth>nav.clientWidth+1;nav.classList.toggle('more',over);nav.classList.toggle('end',over&&nav.scrollLeft+nav.clientWidth>=nav.scrollWidth-2);};
  if(cur){const l=cur.offsetLeft-nav.offsetLeft, r=l+cur.offsetWidth; if(r>nav.scrollLeft+nav.clientWidth||l<nav.scrollLeft) nav.scrollLeft=Math.max(0,r-nav.clientWidth+24);}
  syncMore(); nav.onscroll=syncMore;
  // QA: 좌우 화살표로 탭 이동
  $('tabs').onkeydown=e=>{
    if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
    const i=TABS.findIndex(t=>t.key===tab), n=(i+(e.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length;
    tab=TABS[n].key;cat='전체';studyKind='all';movieKind='전체';render();$('tabs').querySelector(`[data-k="${tab}"]`).focus();e.preventDefault();
  };
}
function renderFilters(){
  const f=$('filters');
  f.classList.toggle('hidden',tab!=='books'&&tab!=='study'&&tab!=='movies');
  f.classList.toggle('seg',tab==='study');
  if(tab==='movies'){
    // 영화 탭: 시트의 '분류'(영화·다큐·드라마)로 버튼을 만듦. 콘텐츠가 있는 분류만 보임
    const used=MOVIE_KINDS.filter(k=>movies.some(m=>mKind(m)===k));
    const opts=['전체',...used];
    if(!opts.includes(movieKind))movieKind='전체';
    f.innerHTML=opts.map(k=>`<button type="button" data-mk="${k}" aria-pressed="${k===movieKind}">${k==='전체'?k:`${MOVIE_ICON[k]} ${k}`}</button>`).join('');
    f.querySelectorAll('button').forEach(b=>b.onclick=()=>{movieKind=b.dataset.mk;render();$('filters').querySelector(`[data-mk="${movieKind}"]`).focus();});
    return;
  }
  if(tab==='study'){
    // 공부 탭: 전체 / 유튜브 / 강의 선택 버튼
    const all=TABS.find(t=>t.key==='study').items.filter(matches);
    const opts=[['all','전체',all.length],['youtube','유튜브',all.filter(x=>x._kind==='youtube').length],['courses','강의',all.filter(x=>x._kind==='courses').length],['webtoon','웹툰',all.filter(x=>x._kind==='webtoon').length]].filter(o=>o[0]==='all'||o[2]>0);
    f.innerHTML=opts.map(([k,l,n])=>`<button type="button" data-sk="${k}" aria-pressed="${k===studyKind}">${l} <span class="seg-n">${n}</span></button>`).join('');
    f.querySelectorAll('button').forEach(b=>b.onclick=()=>{studyKind=b.dataset.sk;render();$('filters').querySelector(`[data-sk="${studyKind}"]`).focus();});
    return;
  }
  buildCats();
  f.innerHTML=CATS.map(c=>`<button type="button" aria-pressed="${c===cat}">${c}</button>`).join('');
  f.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{cat=CATS[i];render();$('filters').querySelectorAll('button')[i].focus();});
}

function bookCard(b){
  return `<button class="book${b.pick?' pick':''}" type="button" data-id="${b.id}">
    <div class="cover-frame">
      <span class="cover"><img src="https://image.yes24.com/goods/${b.id}/L" srcset="https://image.yes24.com/goods/${b.id}/L 270w, https://image.yes24.com/goods/${b.id}/XL 810w" sizes="(max-width:780px) 45vw, 200px" width="270" height="400" alt="${esc(b.title)} 표지" loading="lazy" data-fallback="${esc(b.title)}"></span>
    </div>
    <span class="pick-label">${b.pick?'강력 추천':''}</span>
    <span class="meta">${[b.category,b.author].filter(Boolean).map(esc).join(' · ')}</span>
    <span class="title">${esc(b.title)}</span>
    <span class="b-review">${b.review?esc(b.review):''}</span>
    <span class="hint">${b.hint?esc(b.hint):''}</span>
  </button>`;
}
function mediaCard(it,i){
  let art='';
  if(tab==='movies') art=`<div class="media-art art-${i%3+1}">
      ${it.poster?`<img src="${esc(it.poster)}" alt="${esc(it.title)} 포스터" loading="lazy" data-hide>`:''}
      <span class="tag">🎬 ${it.tv?'SERIES':'FILM'} / ${esc(it.year)}</span><span class="orig">${esc(it.original)}</span></div>`;
  else if(tab==='courses') art=`<div class="media-art art-c${i%2+1}">
      <span class="tag">🎓 COURSE / 0${i+1}</span><span class="big-ico">${i%2?'📖':'🧩'}</span></div>`;
  else art=`<div class="media-art yt-art yt-${i%2+1}">
      <span class="tag">▶ YOUTUBE</span>
      <span class="yt-avatar"><span class="yt-ph" aria-hidden="true">▶</span><img src="${esc(it.avatar)}" alt="${esc(it.title)} 채널 프로필" loading="lazy" onerror="this.remove()"></span>
      <span class="yt-handle">${esc(it.handle)}</span></div>`;
  const sub=tab==='courses'?[it.provider,it.theme].filter(Boolean).join(' · '):(it.theme||'');
  return `<button class="media-card" type="button" data-i="${i}">${art}
    <div class="media-copy">
      <b>${esc(it.title)}</b>${sub?`<small>${esc(sub)}</small>`:''}${it.hint?`<span class="hint" style="display:block">💡 ${esc(it.hint)}</span>`:''}</div></button>`;
}

// 공부: 유튜브·강의를 같은 모양의 가로 카드로. 왼쪽 동그라미에 유튜브는 채널 프로필, 강의는 주제 아이콘
function courseIcon(it){
  const s=`${it.title||''} ${it.theme||''}`;
  return /몬테소리/.test(s)?'🧩':/영어|그림책/.test(s)?'📖':/수면/.test(s)?'🌙':/요리|이유식|식사/.test(s)?'🥣':'🎓';
}
// 웹툰 표지: ① 사이트에 저장한 표지(thumbs/wt_작품번호.jpg) → ② 네이버 원본 → ③ 브랜드 대체 이미지
function webtoonImg(it){
  const no=(String(it.url).match(/titleId=(\d+)/)||[])[1];
  const first=no?`thumbs/wt_${no}.jpg`:(it.cover||BLOG_FALLBACK);
  return `<img src="${esc(first)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-naver="${no?esc(it.cover||''):''}" onerror="blogThumbError(this)">`;
}
function studyCard(it,i){
  const yt=it._kind==='youtube', wt=it._kind==='webtoon', vid=yt&&it.video;
  // 유튜브 영상: 16:9 썸네일 + 재생 버튼 (유튜브 공식 썸네일이라 따로 저장하지 않음)
  if(vid) return `<a class="study-card is-video" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(it.title)} 유튜브 영상 새 창으로 열기">
    <span class="s-video"><img src="https://i.ytimg.com/vi/${esc(it.video)}/mqdefault.jpg" alt="" loading="lazy"><span class="s-play" aria-hidden="true"></span></span>
    <span class="s-body"><span class="s-kind yt">YOUTUBE · 영상</span><b class="s-clamp">${esc(it.title)}</b>${it.channel?`<small>${esc(it.channel)}</small>`:''}${it.hint?`<span class="hint">${esc(it.hint)}</span>`:''}</span><span class="s-go" aria-hidden="true">↗</span></a>`;
  const circle=wt?`<span class="s-webtoon">${webtoonImg(it)}</span>`
    :yt?`<span class="s-circle yt"><span class="s-ph" aria-hidden="true">▶</span>${it.avatar?`<img src="${esc(it.avatar)}" alt="" loading="lazy" onerror="this.remove()">`:''}</span>`
    :`<span class="s-circle course" aria-hidden="true">${courseIcon(it)}</span>`;
  const sub=wt?[it.author,it.days].filter(Boolean).join(' · '):yt?[it.handle,it.theme].filter(Boolean).join(' · '):[it.provider,it.theme].filter(Boolean).join(' · ');
  const kind=wt?'WEBTOON':yt?'YOUTUBE · 채널':'COURSE';
  // 상세 창 없이 유튜브 채널·운영기관·네이버 웹툰 페이지로 바로 이동 (새 창)
  const tag=it.url?`a href="${esc(it.url)}" target="_blank" rel="noopener noreferrer"`:'div';
  const end=it.url?'a':'div';
  return `<${tag} class="study-card" aria-label="${esc(it.title)} ${wt?'네이버 웹툰':yt?'유튜브 채널':'강의 페이지'} 새 창으로 열기">${circle}
    <span class="s-body"><span class="s-kind ${wt?'webtoon':yt?'yt':''}">${kind}</span><b>${esc(it.title)}</b>${sub?`<small>${esc(sub)}</small>`:''}${it.hint?`<span class="hint">${esc(it.hint)}</span>`:''}</span>${it.url?'<span class="s-go" aria-hidden="true">↗</span>':''}</${end}>`;
}
// 콘텐츠 › 웹툰만 볼 때: 영화 탭처럼 2열 표지 그리드 (누르면 네이버 웹툰 새 창)
function webtoonCard(it){
  const days=String(it.days||'').replace(/\s*연재$/,'').replace(/요웹툰$/,'');
  return `<a class="w-card" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(it.title)} 네이버 웹툰 새 창으로 열기">
    <span class="w-cover">${webtoonImg(it)}</span>
    <span class="w-kind">${esc(['WEBTOON',days].filter(Boolean).join(' · '))}</span><b class="w-title">${esc(it.title)}</b>
    ${it.author?`<small class="w-author">${esc(it.author)}</small>`:''}${it.hint?`<p class="m-hint">${esc(it.hint)}</p>`:''}</a>`;
}
// 영화·드라마: 포스터 + '이럴 때 보세요'만. 상세 창과 외부 링크 없음 (한줄평은 1차 버전에서 쓰지 않음)
function movieCard(it){
  const art=it.poster
    ?`<img class="m-poster" src="${esc(it.poster)}" alt="${esc(it.title)} 포스터" loading="lazy" onerror="this.outerHTML='<div class=&quot;m-poster m-fallback&quot;>🎬<span>${esc(it.title).replace(/'/g,'&#39;')}</span></div>'">`
    :`<div class="m-poster m-fallback">🎬<span>${esc(it.title)}</span></div>`;
  const kind=[MOVIE_EN[mKind(it)],it.year].filter(Boolean).join(' · ');
  const text=`<p class="m-hint">${it.hint?esc(it.hint):''}</p>`;
  return `<article class="m-card">${art}<span class="m-kind">${esc(kind)}</span><b class="m-title">${esc(it.title)}</b>${text}</article>`;
}

// 썸네일 불러오는 순서: ① 우리 사이트에 저장한 작은 사진(thumbs/글번호.jpg, 약 45KB)
// → ② 네이버 원본 썸네일(약 125KB) → ③ 브랜드 대체 이미지(파일 안에 들어 있어 항상 보임)
function blogThumbError(img){
  const step=+(img.dataset.step||0)+1; img.dataset.step=step;
  if(step===1&&img.dataset.naver){img.src=img.dataset.naver;return;}
  img.onerror=null; img.src=BLOG_FALLBACK;
}
function blogCard(it){
  const no=(String(it.url).match(/(\d{9,})/)||[])[1];
  const first=no?`thumbs/${no}.jpg`:(it.thumb||BLOG_FALLBACK);
  const thumb=`<img src="${esc(first)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-naver="${no?esc(it.thumb||''):''}" onerror="blogThumbError(this)">`;
  return `<a class="blog-card" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(it.title)} 블로그 글 새 창으로 열기">
    <span class="blog-thumb">${thumb}</span>
    <span class="blog-body"><span class="blog-kind">NAVER BLOG</span><b>${esc(it.title)}</b>${it.hint?`<span class="hint">${esc(it.hint)}</span>`:''}
      <span class="blog-foot"><span class="date">${esc(it.date)}</span><span class="go">블로그에서 읽기 ↗</span></span></span></a>`;
}
// 앱: 보는 기기에 맞는 스토어 버튼만 (아이폰·아이패드 → App Store, 안드로이드 → Google Play, PC → 둘 다)
const DEVICE=(()=>{const u=navigator.userAgent||'';

function fitCover(img){
  if(!img.naturalWidth) return;
  const r=img.naturalHeight/img.naturalWidth;
  // 이미지 크기(L/XL)에 따른 반올림 오차를 감안해 위쪽 기준은 1.62
  const odd=r<1.3||r>1.62;
  img.classList.toggle('fit',odd);
  const box=img.closest('.cover');
  if(!box) return;
  // 상자 크기는 모든 책이 같음 (1:1.45). 넓적한 표지는 양옆을 잘라 꽉 채우고, 길쭉한 표지만 자르지 않고 넣음
  box.classList.toggle('is-wide',r<1.3);
  box.classList.toggle('is-fit',r>1.62);
  if(r<1.3&&!box.querySelector('.blur-bg')){
    const bg=document.createElement('img');
    bg.className='blur-bg';bg.alt='';bg.setAttribute('aria-hidden','true');bg.src=img.currentSrc||img.src;
    box.insertBefore(bg,img);
  }
}

const SHEET_ID='17sYEdFD7Ey5GK-e8tB8f6I6bdx4IoVgdouKo8eblrsg';
function parseCSV(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(cell);cell='';}
    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
    else if(c!=='\r') cell+=c;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows;
}
async function loadTab(name){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}`;
  const res=await fetch(url,{cache:'no-store'});
  if(!res.ok) throw new Error(name+' '+res.status);
  const [head,...body]=parseCSV(await res.text());
  const keys=head.map(h=>h.trim());
  // 탭 이름이 틀리면 구글이 오류 대신 첫 번째 탭을 보내 주므로, 제목 줄로 맞는 탭인지 확인
  const need={'책':'YES24 주소','영화':'TMDB 주소','강의':'과정명','유튜브':'채널 주소','꿀팁':'체크리스트','블로그':'블로그 주소','용품':'블로그 주소','앱':'앱 이름','웹툰':'웹툰 주소','소개':'항목'}[name];
  if(need&&!keys.includes(need)) throw new Error(`'${name}' 탭을 찾지 못했어요 (탭 이름이나 첫 줄이 바뀌었는지 확인)`);
  return body.map(r=>Object.fromEntries(keys.map((k,i)=>[k,(r[i]||'').trim()])));
}

const lines=s=>String(s||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
const yes24Id=u=>(String(u).match(/goods\/(\d+)/)||[])[1];
// TMDB 영화(/movie/)와 TV 시리즈(/tv/) 주소 모두 지원
const tmdbId=u=>(String(u).match(/\/(?:movie|tv)\/(\d+)/)||[])[1];
const isTv=u=>/\/tv\/\d+/.test(String(u));
const ytVideoId=u=>(String(u).match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/)||[])[1]||'';
const ytHandle=u=>{const m=String(u).match(/youtube\.com\/(@[^/?#]+)/);return m?decodeURIComponent(m[1]):'';};
function replaceAll(arr,items){arr.splice(0,arr.length,...items);}

async function loadSheet(){
  try{
    // 속도: 시트 탭을 모두 동시에 요청 (블로그·용품은 실패해도 나머지는 보이도록 따로 받아 둠)
    // 예전 글 방식 '꿀팁' 탭은 화면에서 쓰지 않아서 요청하지 않음
    const extra=['블로그','용품','앱','웹툰'].map(n=>loadTab(n).catch(e=>{console.warn(`${n} 탭을 읽지 못해 파일 안의 내용을 보여 줍니다.`,e);return null;}));
    const [B,M,C,Y,P]=await Promise.all(['책','영화','강의','유튜브','소개'].map(loadTab));
    replaceAll(books,visible(B).map(r=>({id:yes24Id(r['YES24 주소']),title:r['제목'],author:r['저자'],category:r['주제'],
      hint:r['이럴 때 보세요'],review:r['한줄평'],pick:r['강력 추천']==='Y',addon:r['애드온 링크']||''})).filter(b=>b.id&&b.title));
    replaceAll(movies,visible(M).map(r=>({tmdb:tmdbId(r['TMDB 주소'])||'',tv:isTv(r['TMDB 주소']),poster:r['포스터 이미지 주소'],title:r['제목'],original:r['원제'],
      year:r['개봉 연도'],theme:r['주제'],hint:r['이럴 때 보세요'],url:r['TMDB 주소'],review:r['한줄평'],kind:r['분류']||''})).filter(m=>m.title));
    replaceAll(courses,visible(C).map(r=>({title:r['과정명'],provider:r['운영기관'],theme:r['주제'],hint:r['이럴 때 보세요'],
      url:r['과정 주소'],info:r['안내 문구'],review:r['한줄평']})).filter(c=>c.title));
    // 유튜브: '채널 주소' 칸에 영상 주소(watch?v= · youtu.be · shorts)를 넣으면 개별 영상 카드로 보여 줌
    replaceAll(youtube,visible(Y).map(r=>{const u=r['채널 주소'],v=ytVideoId(u);
      return {url:u,video:v,title:v?(r['영상 제목']||r['채널명']):r['채널명'],channel:v?r['채널명']:'',handle:r['핸들']||ytHandle(u),
      avatar:r['프로필 사진 주소'],theme:r['주제'],hint:r['이럴 때 보세요'],about:r['채널 소개'],medical:r['건강 정보']==='Y',review:r['한줄평']};}).filter(y=>y.title));
    // 블로그(후기 탭)·용품: 못 읽은 탭은 파일 안의 내용 유지
    const [G1,G2,A,W]=await Promise.all(extra);
    if(W) replaceAll(webtoons,visible(W).map(r=>({url:r['웹툰 주소'],hint:r['이럴 때 보세요'],title:r['제목'],author:r['작가'],days:r['연재'],cover:r['표지 주소']})).filter(w=>w.url&&w.title));
    if(A) replaceAll(apps,visible(A).map(r=>({title:r['앱 이름'],hint:r['이럴 때 보세요'],about:r['한 줄 소개'],topic:r['주제'],
      ios:r['App Store 주소'],android:r['Google Play 주소'],icon:r['아이콘 주소'],dev:r['개발사']})).filter(a=>a.title));
    for(const [G,arr] of [[G1,blogs],[G2,goods]]){
      if(G) replaceAll(arr,visible(G).map(r=>({url:r['블로그 주소'],title:r['제목'],hint:r['이럴 때 보세요'],thumb:r['썸네일 주소'],
        date:r['작성일'],topic:r['주제']})).filter(b=>b.url&&b.title));
    }
    // 소개: 비어 있는 칸은 파일 안의 기본값 유지
    const kv=Object.fromEntries(P.map(r=>[r['항목'],r['내용']]));
    const set=(k,v)=>{if(v)PROFILE[k]=v;};
    set('nickname',kv['닉네임']);set('avatarText',kv['프로필 글자']);set('avatar',kv['프로필 사진 주소']==='profile.jpg'?PROFILE_IMG:kv['프로필 사진 주소']);
    set('role',kv['한 줄 소개']);set('story',kv['만든 이유']);
    const rules=[kv['추천 기준 1'],kv['추천 기준 2'],kv['추천 기준 3']].filter(Boolean); if(rules.length)PROFILE.rules=rules;
    PROFILE.links=[1,2,3].map(n=>({label:kv[`링크 ${n} 이름`],url:kv[`링크 ${n} 주소`]||''})).filter(l=>l.label);
    renderProfileBtn();
    if(!$('dialog').classList.contains('open')) render(); else window.__sheetPending=true;
    document.documentElement.dataset.source='sheet';
  }catch(e){
    console.warn('시트를 읽지 못해 파일 안의 내용을 보여 줍니다.',e);
    document.documentElement.dataset.source='embedded';
  }
}
loadSheet();
</script>
</body>
</html>
